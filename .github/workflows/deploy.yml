# Section 7 - deploying to GitHub Pages.
#
# Every push to `main` (and manual dispatch) builds the site and publishes it
# with the official Pages actions. The build runs scripts/build-shelf.ts first
# (via the `prebuild` npm hook), so the deployed site always reflects the CSV
# currently on main.
#
# One-time setup in the repository: Settings -> Pages -> Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel in-progress runs so a live
# deploy always finishes.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Pages
        id: pages
        # Pages must already be enabled with Source set to "GitHub Actions"
        # (Settings -> Pages). This step only reads that configuration; it
        # cannot create it, because the automatic workflow token is not
        # allowed to call the "create a Pages site" API.
        uses: actions/configure-pages@v5

      - name: Resolve base path
        id: base
        # Project sites live at https://<owner>.github.io/<repo>/, user/org sites
        # (repo named <owner>.github.io) live at the root. configure-pages reports
        # the correct value in `base_path`.
        run: echo "path=${{ steps.pages.outputs.base_path }}/" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          VITE_BASE_PATH: ${{ steps.base.outputs.path }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
